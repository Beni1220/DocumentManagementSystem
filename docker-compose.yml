services:
  db:
    image: postgres:17
    container_name: documentmanagement_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  rest:
    build:
      context: .
      dockerfile: DocumentManagementSystem/Dockerfile/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_USER:-dms}
      Minio__SecretKey: ${MINIO_PASSWORD:-dms_secret}
      Minio__BucketName: documents
      Elasticsearch__Url: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  ocrworker:
    build:
      context: .
      dockerfile: DocumentManagementSystem.OcrWorker/Dockerfile
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_USER:-dms}
      Minio__SecretKey: ${MINIO_PASSWORD:-dms_secret}
      Minio__BucketName: documents
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

  indexingworker:
    build:
      context: .
      dockerfile: DocumentManagementSystem.IndexingWorker/Dockerfile
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Elasticsearch__Url: http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documentmanagement_frontend
    ports:
      - "80:80"
    depends_on:
      - rest
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - frontend_logs:/var/log/dms
  
  broker:
    profiles: ["paperless"]
    image: redis:7
    restart: unless-stopped

  paperless:
    profiles: ["paperless"]
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - broker
      - db
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_SECRET_KEY: example123
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: http://paperless.localhost

      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media

  rabbitmq:
    image: rabbitmq:4-management
    container_name: documentmanagement_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: documentmanagement_minio
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-dms}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-dms_secret}
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: documentmanagement_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20


  logstash:
    image: docker.elastic.co/logstash/logstash:9.3.0
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_WORKERS: 1
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - frontend_logs:/var/log/dms:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: dms-kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  frontend_logs:
  logstash_data:
  postgres_data:
  paperless_data:
  paperless_media:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
