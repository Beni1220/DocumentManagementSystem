services:
  db:
    image: postgres:17
    container_name: documentmanagement_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  rest:
    build:
      context: .
      dockerfile: DocumentManagementSystem/Dockerfile/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documentmanagement_frontend
    ports:
      - "80:80"
    depends_on:
      - rest
      - paperless
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
  
  broker:
    image: redis:7
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - broker
      - db
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_SECRET_KEY: example123
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: http://paperless.localhost

      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media



volumes:
  postgres_data:
  paperless_data:
  paperless_media:
