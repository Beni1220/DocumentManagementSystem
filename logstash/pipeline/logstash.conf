# Die Zugriffe auf die Webseite und /api landen in dieser Datei.
input {
  file {
    path => "/var/log/dms/access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/nginx.sincedb"
    add_field => { "service" => "frontend" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "dms-logs-%{+yyyy.MM.dd}"
    ilm_enabled => false
    data_stream => false
  }
}
